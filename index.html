        @media print {

        .linha-clicavel { transition: filter 0.12s, background 0.12s; }
        .linha-clicavel:hover, .linha-clicavel:active { filter: brightness(0.96); }

        /* ajustes gerais pra tela de celular (at\xE9 640px de largura) \u2014 nada
           de fun\xE7\xE3o muda aqui, \xE9 s\xF3 deixar mais leg\xEDvel numa tela estreita */
        @media (max-width: 640px) {
          /* formul\xE1rio de editar viagem: as duas colunas (viagem/financeiro

          .grid-duas-colunas-viagem { grid-template-columns: 1fr !important; }

          /* tabelas viram rol\xE1veis pro lado, em vez de espremer as colunas

             Importante: a <table> em si mant\xE9m o layout normal de tabela
             (sen\xE3o as colunas desalinham entre uma linha e outra); quem rola
             de lado \xE9 o quadrado que envolve a tabela */
          table { white-space: nowrap !important; }
          div:has(> table) { overflow-x: auto !important; }

          /* a coluna lateral de "Filtrar por empresa" em Boletos passa a
