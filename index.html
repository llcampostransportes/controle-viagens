        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        button { font-family: inherit; }
        @media print {
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          /* sem isso, o navegador ignora as cores de fundo na hora de imprimir/gerar PDF,
             pra "economizar tinta" \u2014 aqui a gente for\xE7a ele a manter as cores dos relat\xF3rios */
          * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
        }
        input:focus, select:focus, textarea:focus { border-color: #D9A419 !important; box-shadow: 0 0 0 3px rgba(217,164,25,0.15); }

        /* linhas clic\xE1veis de lista (ver lista de a receber/recebido/comiss\xE3o,
           viagens, boletos etc) ganham um destaque leve ao passar o mouse (ou
           tocar no iPad), pra ficar claro que \xE9 clic\xE1vel e ajudar a acompanhar
           qual linha est\xE1 selecionada */
        .linha-clicavel { transition: filter 0.12s, background 0.12s; }
        .linha-clicavel:hover, .linha-clicavel:active { filter: brightness(0.96); }

        /* ajustes gerais pra tela de celular (at\xE9 640px de largura) \u2014 nada
           de fun\xE7\xE3o muda aqui, \xE9 s\xF3 deixar mais leg\xEDvel numa tela estreita */
        @media (max-width: 640px) {
          /* formul\xE1rio de editar viagem: as duas colunas (viagem/financeiro
             e abastecimento/gastos) viram uma s\xF3 empilhada, e o resumo fixo
             deixa de "grudar" no topo (sen\xE3o atrapalha rolando no celular) */
          .grid-duas-colunas-viagem { grid-template-columns: 1fr !important; }

          /* tabelas viram rol\xE1veis pro lado, em vez de espremer as colunas
             at\xE9 ficar ileg\xEDvel \u2014 funciona pra toda tabela do app de uma vez.
             Importante: a <table> em si mant\xE9m o layout normal de tabela
             (sen\xE3o as colunas desalinham entre uma linha e outra); quem rola
             de lado \xE9 o quadrado que envolve a tabela */
          table { white-space: nowrap !important; }
          div:has(> table) { overflow-x: auto !important; }

          /* a coluna lateral de "Filtrar por empresa" em Boletos passa a
             ficar em cima da lista, em vez de do lado (n\xE3o cabe lado a lado
             numa tela estreita) */
          .sidebar-empresas { width: 100% !important; position: static !important; }
          .boletos-flex-row { flex-direction: column !important; }

          /* cabe\xE7alho: t\xEDtulo e bot\xF5es menores, ocupando a largura toda */
          .header-titulo { font-size: 22px !important; }
          .header-botoes button, .header-botoes label { padding: 7px 10px !important; font-size: 12px !important; }

          /* modais e dropdowns n\xE3o avan\xE7am mais largo que a tela */
          .painel-modal { width: 92vw !important; max-width: 92vw !important; left: 0 !important; }

          /* barra de navega\xE7\xE3o vertical vira uma faixa horizontal em cima,

          /* no celular, a barra lateral empilha ACIMA do conte\xFAdo (em vez de do

          .app-shell { flex-direction: column !important; }
          .nav-lateral {

            flex-direction: row !important; flex-wrap: nowrap !important; overflow-x: auto !important;
            overflow-y: hidden !important; position: static !important; padding: 8px !important;

          .nav-lateral .nav-divider { display: none !important; }
          .nav-lateral .nav-item { flex-direction: column !important; white-space: nowrap; padding: 8px 10px !important; font-size: 10px !important; flex-shrink: 0; }

          /* os menuzinhos que abrem (Dashboard: Viagens/Geral, e Relat\xF3rios)
